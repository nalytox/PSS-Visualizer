# Límites de ejecución (sección 13 del spec).
# Valores iniciales: se ajustarán tras las primeras pruebas con programas reales del curso.

[limits]
max_processes = 32
max_threads_per_process = 16
max_steps = 5000
wall_time_ms = 10000
memory_bytes = 268435456          # 256 MiB
output_bytes_per_process = 65536  # 64 KiB
trace_bytes_compressed = 20971520 # 20 MiB
