name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        # aarch64 corre en un runner arm64 real: ptrace no funciona bajo emulación.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Trazas de referencia de aarch64 (se suben para revisarlas y agregarlas al repositorio)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: UPDATE_REFERENCE=1 cargo test -p pss-tracer --test examples
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04-arm'
        with:
          name: referencias-aarch64
          path: traces/reference/aarch64/

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Los tipos generados están al día con el esquema
        run: npm run gen:types:check
      - name: Las trazas sintéticas están al día con sus guiones
        run: npm run gen:synth && git diff --exit-code -- ../traces
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Servidor y tracer para las pruebas de extremo a extremo
        run: cargo build --release -p pss-server -p pss-tracer
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
