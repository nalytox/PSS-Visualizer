[package]
name = "pss-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "sync", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "limit"] }
